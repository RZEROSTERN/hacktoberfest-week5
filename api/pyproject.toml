[project]
name = "last-candle-api"
version = "1.0.0"
description = "Local dialogue orchestration for La Última Vela."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-psutil>=7.2.2.20260906",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: runs a real local model; never run in CI"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
