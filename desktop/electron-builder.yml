appId: mx.dev1.lastcandle
productName: LastCandle
copyright: Copyright (c) 2026 Marco Ramírez. MIT License.
directories:
  output: release
files:
  - dist/**
  - package.json
asar: true
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
extraResources:
  - from: build/ollama
    to: ollama
  - from: build/api
    to: api
  - from: ../web/.output/public
    to: web
  - from: ../CREDITS.md
    to: CREDITS.md
  - from: ../LICENSE
    to: LICENSE
  - from: node_modules/electron/dist/LICENSE
    to: electron/LICENSE
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: electron/LICENSES.chromium.html
mac:
  artifactName: LastCandle-${version}-arm64.${ext}
  category: public.app-category.games
  target:
    - target: dmg
      arch: arm64
  minimumSystemVersion: "14.0"
  identity: "-"
  hardenedRuntime: false
dmg:
  title: LastCandle ${version}
  sign: false
win:
  target:
    - target: nsis
      arch: x64
  artifactName: LastCandle-${version}-x64-setup.${ext}
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  uninstallDisplayName: LastCandle
linux:
  category: Game
  executableName: last-candle
  syncDesktopName: true
  maintainer: Marco Ramírez <marco.ramirez@rzerocorp.com>
  synopsis: A bilingual narrative game about remembrance
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
appImage:
  artifactName: LastCandle-${version}-x86_64.${ext}
deb:
  packageName: last-candle
  artifactName: last-candle_${version}_amd64.${ext}
  compression: xz
  depends:
    - libgtk-3-0 | libgtk-3-0t64
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0 | libatspi2.0-0t64
    - libuuid1
    - libsecret-1-0
    - libasound2 | libasound2t64
